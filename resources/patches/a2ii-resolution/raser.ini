
;********************HELPDESK********************
[HELPDESK]		

;================================================
; Enables output of special messages and errors
; to debug.txt file
;================================================
DEBUGON=0

;================================================
; Enables special features:
; Tweak menu/extra camera's/framerate printing.
;================================================
TWEAK_MODE=0



;********************MOVIES********************
[MOVIES]			

;================================================
; Select '1' to view smacker movies fullscreen,
; or 0 to view them halfscreen.
;================================================
SIZE=1			


;================================================
; Enables or disables smacker movies.
;================================================
ON=1


;********************PROGRAM*********************
[PROGRAM]			

;================================================
; Program version, shown in options menu.
;================================================
VERSION=1.01

;================================================
; Application name
;================================================
NAME=A2 RACER II

;================================================
; Resolution the menu saves when starting:
; 0=320x200x8
; 1=640x480x8
; 3=640x480x16
;================================================
RESOLUTION=3

;================================================
; Selects the focus to render to:
; 0=BACK_SCREEN	(video memory)
; 1=BUFFER_SCREEN (system memory)
;================================================
FOCUS=1

;********************MOUSE***********************
[MOUSE]

;================================================
; Read in gm_body ( skelet2d_get_mouse_type() )
; Not used!
;================================================
TYPE=1


;********************IMG*************************
[IMG]

;================================================
; Image file to retrieve data from.
;================================================
RCSFILE=rcs

;********************PALET***********************
[PALET]

;================================================
; Track specific palettes: first arg is the
; version for 8-bit mode, second is the version
; for 16-bit mode.
;================================================
ETAPPE0=e00_pal.pcx,e02_pl16.pcx
ETAPPE1=e01_pal.pcx,e02_pl16.pcx
ETAPPE2=e02_pal.pcx,e02_pl16.pcx
ETAPPE3=e03_pal.pcx,e02_pl16.pcx
ETAPPE4=e04_pal.pcx,e02_pl16.pcx
ETAPPE5=e05_pal.pcx,e02_pl16.pcx
ETAPPE6=e00_pal.pcx,e02_pl16.pcx

;================================================
; Read in gm_body (skelet2d_get_show_palette())
; Not used!
;================================================
SHOW=0

;********************SOUND***********************
[SOUND]

;================================================
; Enables/disables all sound.
;================================================
ON=1			

;================================================
; Number of sound buffers that can be played
; at once.
;================================================
BUFFERS=60		

;================================================
; Music volume
; (0=off, 100=minimum, 3100=maximum)
;================================================
MUSICVOLUME=700

;================================================
; Sound effects volume
; (0=off, 100=minimum, 3100=maximum)
;================================================
SFXVOLUME=700

;================================================

;********************MUSIC***********************
[MUSIC]

;================================================
; Music files (without ".wav" extension)
; Note:Music is currently disabled in
; start_game().
;================================================
0=M_FUNK
1=M_HEAVY
2=M_HOP
3=M_REMIK
4=M_TRANS
5=M_ZZTOP

;================================================
; Number of music files to be played.
;================================================
count=6

;********************MAPS************************
[MAPS]

;================================================
; Arg 0:
;       0=highway(snelweg), 1=city(stad)
; Arg 1:
;       Filenames for maps (without extension)
; Arg 2, 3, 4, 5:
;       Textures to load for map (without ext.)
; Arg 6:
;       Lores unaccelerated filename (without
;       extension) of the sky.
; Arg 7:
;       Hires unaccelerated filename (without
;       extension) of the sky.
; Arg 8:
;       Name of the track (shown in main menu)
; Arg 9:
;       Zero-based index in music array as
;       described above.
; Arg 10:
;       Timer (should be kept 10000!)
;================================================
0=1,etappe0,e00_weg,e00_gras,e00_gra2,e00_vang,scrl_lo,scrl_hi,AMSTERDAM,0,10000
1=0,etappe1,e01_weg,e01_gras,e01_gra2,e01_vang,scrl_lo,scrl_hi,AMSTERDAM - DEN HAAG,5,10000
2=1,etappe2,e02_weg,e02_gras,e02_gra2,e02_vang,scrl_lo,scrl_hi,DEN HAAG,4,10000
3=0,etappe3,e03_weg,e03_gras,e03_gra2,e03_vang,scrl_lo,scrl_hi,DEN HAAG - ROTTERDAM,0,10000
4=1,etappe4,e04_weg,e04_gras,e04_gra2,e04_vang,scrl_lo,scrl_hi,ROTTERDAM,1,10000
5=0,etappe5,e05_weg,e05_gras,e05_gra2,e05_vang,scrl_lo,scrl_hi,ROTTERDAM - AMSTERDAM,3,10000
6=1,etappe6,e00_weg,e00_gras,e00_gra2,e00_vang,scrl_lo,scrl_hi,AMSTERDAM,4,10000
7=0,etappe7,e03_weg,e03_gras,e03_gra2,e03_vang,scrl_lo,scrl_hi,MÜNCHEN - BERLIN,3,10000
8=1,etappe8,e02_weg,e02_gras,e02_gra2,e02_vang,scrl_lo,scrl_hi,BERLIN,0,10000

;================================================
; Number of tracks to read from ini-file.
;================================================
count=9

;********************PROGRESS********************
[progress]

;================================================
; Number of percents to read from ini-file.
; This value is written when "calculate" is
; enabled.
;================================================
COUNT=11

;================================================
; Enable recalc of progress bar percents.
; Should be done once to get correct
; percentages, then disabled to use these
; values for displaying the progress bar
;================================================
calculate=0

;================================================
; Percentages saved by game when "calculate" is
; enabled.
;================================================
percent0=10
percent1=23
percent2=72
percent3=74
percent4=75
percent5=91
percent6=91
percent7=91
percent8=94
percent9=94
percent10=100


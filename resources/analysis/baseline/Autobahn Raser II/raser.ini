;********************MAPS************************
[MAPS]

;================================================
; Arg 0:
;       0=highway(snelweg), 1=city(stad)
; Arg 1:
;       Filenames for maps (without extension)
; Arg 2, 3, 4, 5:
;       Textures to load for map (without ext.)
; Arg 6:
;       Lores unaccelerated filename (without
;       extension) of the sky.
; Arg 7:
;       Hires unaccelerated filename (without
;       extension) of the sky.
; Arg 8:
;       Name of the track (shown in main menu)
; Arg 9:
;       Zero-based index in music array as
;       described above.
; Arg 10:
;       Timer (should be kept 10000!)
; Arg 11: 
;	Ambient lighting, intensity RED
; Arg 12:
; 	Ambient lighting, intensity GREEN
; Arg 13:
;	Ambient lighting, intensity BLUE
;================================================
0=1,etappe0,e00_weg,e00_gras,e00_gra2,e00_vang,scrl_lo,scrl_hi,München,0,10000,75,75,75
1=1,etappe1,e01_weg,e01_gras,e01_gra2,e01_vang,scrl_lo,scrl_hi,Berlin,5,10000,75,75,75
2=1,etappe2,e02_weg,e02_gras,e02_gra2,e02_vang,scrl_lo,scrl_hi,Hamburg,4,10000,75,75,75
3=1,etappe3,e03_weg,e03_gras,e03_gra2,e03_vang,scrl_lo,scrl_hi,Dortmund,0,10000,5,5,5
4=1,etappe4,e04_weg,e04_gras,e04_gra2,e04_vang,scrl_lo,scrl_hi,Frankfurt,1,10000,75,75,75
5=1,etappe5,e05_weg,e05_gras,e05_gra2,e05_vang,scrl_lo,scrl_hi,Wien,3,10000,75,75,75
6=1,etappe6,e06_weg,e06_gras,e06_gra2,e06_vang,scrl_lo,scrl_hi,leer,4,10000,75,75,75
7=1,etappe7,e07_weg,e07_gras,e07_gra2,e07_vang,scrl_lo,scrl_hi,leer,3,10000,75,75,75
8=0,etappe8,e08_weg,e08_gras,e08_gra2,e08_vang,scrl_lo,scrl_hi,Hamburg-Berlin,0,10000,75,75,75
9=0,etappe9,e09_weg,e09_gras,e09_gra2,e09_vang,scrl_lo,scrl_hi,München-Wien,0,10000,75,75,75
10=0,etappe10,e10_weg,e10_gras,e10_gra2,e10_vang,scrl_lo,scrl_hi,Dortmund-Frankfurt,0,10000,75,75,75

;================================================
; Number of tracks to read from ini-file.
;================================================
count=11

;********************PROGRESS********************
[progress]

;================================================
; Number of percents to read from ini-file.
; This value is written when "calculate" is
; enabled.
;================================================
COUNT=11

;================================================
; Enable recalc of progress bar percents.
; Should be done once to get correct
; percentages, then disabled to use these
; values for displaying the progress bar
;================================================
calculate=0

;================================================
; Percentages saved by game when "calculate" is
; enabled.
;================================================
percent0=10
percent1=23
percent2=72
percent3=74
percent4=75
percent5=91
percent6=91
percent7=91
percent8=94
percent9=94
percent10=100


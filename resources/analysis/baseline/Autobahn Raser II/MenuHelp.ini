[TfrmGarage]
WERKSTATT
Hierher kommst Du, wenn Du deinen Wagen reparieren oder ein Tune Up erwerben möchtest.
Außerdem kannst Du hier einen der anderen Wagen, die bereits in deinem Besitz sind, auswählen. Du kannst jedoch mit einem Wagen nur dann am Rennen teilnehmen, wenn er zu der aktuellen Gruppe gehört.

SCHADEN REPARIEREN
Schäden, die bei einem Rennen entstanden sind, können in der Werkstatt repariert werden.

TUNING
Wähle eines der Tune Ups: Reifen, Bremsassistent, Getriebe, Motor, Turbo. Beachte jedoch, dass Du erst einen neuen Motor kaufen musst, bevor Du den Turbo erwerben kannst.

WAGEN WÄHLEN
Mit diesen Schaltflächen kannst Du einen der anderen Wagen, die sich momentan in deinem Besitz befinden, auswählen oder ansehen. Du kannst mit einem Wagen nur dann am Rennen teilnehmen, wenn er zu der aktuellen Gruppe gehört.

WAGEN VERKAUFEN
Du kannst deinen Wagen zum aktuellen Zeitwert verkaufen. Du solltest jedoch erst überprüfen, ob Du genügend Geld hast, um einen neuen Wagen derselben Gruppe kaufen zu können.

SHOWROOM
Im Showroom kannst Du einen neuen Wagen erwerben.

[TfrmHallOfFame]
HALL OF FAME
Du wirst automatisch in die Hall of Fame aufgenommen, wenn Du die schnellste Runde oder die schnellste Gesamtzeit fährst. In der Hall of Fame sind alle Rekorde aufgeführt.

Denke immer daran, dass eine Ehrung in der Hall of Fame nur den Besten der Besten vergönnt ist.

[TfrmOptionsMenuSide]
OPTIONEN
Dieses Fenster bietet Dir eine Übersicht deiner gesamten Einstellungen.
Von hier aus gelangst Du zu den Menüs Steuerung, Einstellungen und Spieler.

STEUERUNG
Hier kannst Du die Steuerung einstellen. Dabei hast Du die Auswahl zwischen: Tastatur, Joystick, Gamepad und Lenkrad.
Tastenkonfiguration: Gib hier die von Dir bevorzugten Tasten ein.
Lenkempfindlichkeit: Mit dieser Schaltfläche stellst Du die Empfindlichkeit ein,
links bedeutet geringe Empfindlichkeit,
rechts bedeutet hohe Empfindlichkeit.

EINSTELLUNGEN
Lautstärke: Hier kannst Du die Lautstärke der Polizei, der Musik und der Effekte ändern.
Videomodus: Je nach Hardware kannst Du zwischen drei verschiedenen Videomodi wählen: 320x200, 640x480 oder 3D-Karte.
Startinfo-Fenster: Das Startinfo-Fenster enthält Informationen zur aktuellen Tastenkonfiguration. Du kannst die Option "Dieses Fenster vor dem Start anzeigen" auch deaktivieren.

SPIELER
Neuer Spieler: Erlaubt einem anderen Spieler, ein neues Spiel zu starten.
Speichern: Speichert Deine aktuellen Spieldaten. Diese Speicherfunktion ergänzt die automatische Sicherung.
Laden: Lädt ein gespeichertes Spiel durch Auswahl des Spiels aus dem Verzeichnis und Betätigen der Schaltfläche "Laden".
Löschen: Löscht einen Spieler oder ein gespeichertes Spiel aus dem Verzeichnis.
Umbenennen: Hier kannst Du deinen aktuellen Spielernamen ändern.

[TfrmRaceMenu]
RACEMENÜ
Dies ist das erste Fenster, das sich beim Start des Spiels öffnet.
In diesem Fenster kannst Du zwischen verschiedenen Modi wählen: Zeitfahren, Sunday Cup oder Meisterschaft.

ZEITFAHREN
Versuche, die Zeitvorgaben für die Qualifikation zu unterbieten, um Dir den Bonus Car zu sichern.
Du fährst eine Rennstrecke ohne Gegner, Polizei oder sonstigen Verkehr. So kannst Du ideal trainieren und Rundenrekorde brechen.

SUNDAY CUP
Hiermit startest Du den Sunday Cup. Du kannst die Rennstrecke und den Rennwagen frei wählen.
Wenn Du auf allen Rennstrecken des Sunday Cup gewonnen hast, erhältst Du den Bonus Car.

MEISTERSCHAFT
Hiermit startest Du den Meisterschaftsmodus, bei dem drei Gruppen zu unterscheiden sind.
Dein Ziel ist es, Champion aller Gruppen zu werden und den Titel "Autobahn Raser" zu gewinnen.

BEENDEN
Um das Spiel zu beenden und zu Windows zurückzukehren, betätigst Du die Schaltfläche "Beenden" im Racemenü.

[HelpOnStory]
AUTOBAHN RASER, DIE GESCHICHTE
Über Jahre hat die berüchtigte Organisation der Autobahn Raser illegale Rennen in ganz Deutschland veranstaltet. Nun formiert sich die wilde Meute zu einer neuen Runde ungehemmter Raserei.
Die Meisterschaft führt durch alle Jahreszeiten. Auftakt ist bei Nacht und Schnee das Nachtrennen von Dortmund, das große Finale steigt im goldenen Oktober in Berlin.
Nach einer halben Ewigkeit hast Du es endlich geschafft, Kontakt zur den Autobahn Rasern aufzunehmen. Beim Treffen in einer versteckten Werkstatt wird Dir schließlich erlaubt, Dich als Anfänger in der Gruppe A zu beweisen. Hast Du das Zeug, Meister aller Klassen und König der Raser zu werden?

[TfrmQuickRaceMenu]
SUNDAY CUP
Hiermit startest Du den Sunday Cup. Du kannst die Rennstrecke und den Rennwagen frei wählen.

EINEN WAGEN WÄHLEN
Zuerst wählst Du eine Gruppe.
Gruppe A: Kompaktwagen, leichtes Handling, niedrige Geschwindigkeit, Niveau: Anfänger
Gruppe B: Sportwagen, mittlere Geschwindigkeit, Niveau: Amateur
Gruppe C: Supersportwagen, hohe Geschwindigkeit, Niveau: Profi
Dann wählst Du den Wagen, mit dem Du fahren möchtest.

RUNDENZAHL WÄHLEN
Du kannst zwischen 1 und 5 Runden wählen. Mit Ausnahme der Autobahnstrecken fährst Du hier nur eine Runde.

SUNDAY-CUP-WERTUNG
Hier kannst Du Deine persönlichen Rennwertungen und die deiner Gegner abrufen.
Von hier aus gelangst Du in die Hall of Fame, in der die Bestzeiten aufgeführt sind.

BONUS CAR GEWINNEN
Wenn Du auf allen Sunday-Cup-Rennstrecken als Sieger durchs Ziel gefahren bist, gewinnst Du den Bonus Car.

[TfrmTimeTrialMenu]
ZEITFAHREN
Hier kannst Du die Strecke und den Wagen im Zeitfahren ohne Verkehr, Polizei oder Gegner auswählen.
Dabei kannst Du versuchen, die Qualifikationszeiten zu unterbieten, um den Bonus Car zu gewinnen. Du kannst auch versuchen, die schnellsten Runden zu fahren und ohne Verkehr trainieren.
Mit "Esc" kannst Du das Rennen beenden.

EINEN WAGEN WÄHLEN
Zuerst wählst Du eine Gruppe.
Gruppe A: Kompaktwagen, leichtes Handling, niedrige Geschwindigkeit, Niveau: Anfänger
Gruppe B: Sportwagen, mittlere Geschwindigkeit, Niveau: Amateur
Gruppe C: Supersportwagen, hohe Geschwindigkeit, Niveau: Profi
Dann wählst Du den Wagen, mit dem Du fahren möchtest.

BONUS CAR GEWINNEN
Versuche, die Qualifikationszeiten zu unterbieten, um Dir den Time-Trial-Bonuswagen zu sichern.

WERTUNG ZEITFAHREN
Hier kannst Du Deine fünf besten Rundenzeiten betrachten.
Von hier aus gelangst Du in die Hall of Fame, in der die Bestzeiten aufgeführt sind.

[TfrmTournamentMenu]
MEISTERSCHAFT
Die Meisterschaft gliedert sich in drei Gruppen.
Dein Ziel ist es, Champion aller Gruppen zu werden und den Titel "Autobahn Raser" zu gewinnen.

GRUPPE A
Gruppe A wird auch die "Gruppe der Kompaktwagen" genannt.
Hier hast Du die Möglichkeit, Dir einen Namen zu machen.
Auf 7 Rennstrecken trittst Du gegen einige sehr talentierte Fahrer an.

GRUPPE B
Gruppe B wird auch die "Gruppe der Sportwagen" genannt.
Hier trittst Du gegen 6 hochkarätige Gegner auf 8 Strecken um einen Platz in der nächsthöheren Gruppe an.
Bevor Du in der Gruppe B an den Start gehen kannst, musst Du erst in der Gruppe A gewonnen haben.

GRUPPE C
Gruppe C wird auch die "Gruppe der Supersportwagen" genannt.
Die Gruppe C ist die ultimative Herausforderung. Du trittst gegen die Elite der Organisation an, die mit sensationellen Wagen und halsbrecherischen Geschwindigkeiten um die Meisterschaft kämpft.
Bevor Du in der Gruppe C an den Start gehen kannst, musst Du erst in der Gruppe B gewonnen haben.
Bei einem Sieg in dieser Gruppe gewinnst Du den ultimativen Bonus Car und darfst dich Autobahn Raser nennen!

GRUPPENWERTUNG
1 - Das sind Deine eigenen Rennwertungen und Deine Plazierung in der Gruppe sowie die Rennwertungen und Plazierungen deiner Gegner.
2 - Das sind Deine Rundenzeiten und -wertungen.


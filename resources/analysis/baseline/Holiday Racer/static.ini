STORY=The second track will be in Paris. The route 'd'amour' leads along the Arche of Triumph, the Eifeltower, the Notre Dame en the Louver. The winner of this stage may try his luck in the Great Prize festival. You have to finish at least %s to qualify for next track.
WINTEXT=Boy oh boy, what an amazing driver! You finished first! Bravo! You deserve a go in our great prize festival. Come on down and give it a go!

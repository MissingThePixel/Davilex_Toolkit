STORY=In the third track you will drive from Paris to Lyon; the so-called Route de Soleil. You start on the chaotic and perilous ringway 'Periferique' around Paris. This route follows the jammed motorway to Lyon. You have to finish at least %s to qualify for next track.
WINTEXT=All right! You came in first! You are an amazing driver. Say, your real name isn't in fact Michael Schumacher, aye? Go on, collect your prize in the Great Prize festival! And, can you check in afterwards for the dope test?
QUALIFYTEXT=Wow, I thought for a minute you were going to make it. But no. No prizes for you I'm afraid. Oh well, at least you've qualified for tomorrow's stage. That's something.
LOSETEXT=Because we feel so sorry for you that you've lost today, we want to offer you a momentum. A miniature car, made of your car's scrap. Here you are. Have fun with it. Try not to make such a mess next time. 

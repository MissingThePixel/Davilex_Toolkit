;
; Specifies settings for specific controls. 6 control classes can be modified
; using this file: TLabel, TButton, TEdit, TImage, TDaviGraphicGrid and TDaviStatusIndicator.
;
; Structure:
; [<FormClassname>]
; <ControlName>.<Property>=<Value>
;
; The properties that can be set for each control is:
;   TLabel               : Caption, Font, Left, Top, Hint
;   TButton              : Caption, Font, DisabledFontColor, Left, Top, Hint
;   TEdit                : Font, Left, Top, Hint
;   TImage               : Left, Top, Hint
;   TDaviGraphicGrid     : Font, FontHighlight, FontHeader, ColWidth#, Left, Top, Hint
;   TDaviStatusIndicator : Left, Top, Hint
;
; Captions and Hints are specified as strings
; Fonts are specified as Font, FontSize and FontColor
; Left, Top and ColWidth# are specified as integers
; Colors are specified as COLORREF values: a specific 4-byte hexadecimal number.
;   The low three bytes represent RGB color intensities for blue, green, and red,
;   respectively.
;
; A special seciton called [DEFAULT] sets default values for all properties.

[DEFAULT]
Caption=<No Value>
Font=1
FontSize=12
BtnFontSize=11
FontColor=0x000E2862
;FontColor=0x00FFFFFF
BtnFontColor=0x000E2862
DisabledFontColor=0x004B6163
HighlightSize=11
HighlightColor=0x000077FF
HeaderSize=12
HeaderColor=0x00AAAAAA
ColWidth0=100
ColWidth1=100
ColWidth2=100
ColWidth3=100
ColWidth4=100


;********************BEST TIMES******************
[BEST TIMES]

;================================================
; LAP_RECORD_Ex (x=zero based track index)
; lap record in msecs, saved by game.
;================================================
; RACE_RECORD_Ex (x=zero based track index)
; race record in msecs, saved by game.
;================================================
; TIME_CHECK_COUNT_Ex (x=zero based track index)
; Number of checkpoints found in track.

;********************INPUT***********************
[INPUT]

;================================================					
; Selects input device:
; 1=Keyboard
; 2=Joypad
; 3=Wheel/Joystick
; 4=Sidewinder ForceFeedback Joystick
;================================================
DEVICE=1
;===================Steer left==================
LEFT=37
;===================Steer right=================
RIGHT=39
;===================Gas=========================
UP=38
;===================Brake=======================
DOWN=40
;===================Turbo=======================
EXTRA1=17
;===================Handbrake===================
EXTRA2=18
;===================Horn========================
EXTRA3=32
;================================================					
; Wheel/Joystick sensitivity (0=min, 100=max)
;================================================					
SENSITIVITY=50


;********************OPTIONS*********************
[OPTIONS]
;================================================					
; Enable resizing of textures because some
; video cards can't handle non-square textures
;================================================
resizetexture=0

;================================================
; Sets the number of visible chunks (Def.=30)
;================================================
visiblechunks=30

;================================================
; Enables/disables positional sound.
;================================================
3dsound=1

;================================================
; Read in game_info_benzine_prijs
; Not used!
;================================================
benzineprijs=1

;================================================
; Enable texture copying (brake lights,
; sirenes, traffic signs, radar).
;================================================					
texturecopy=0

;================================================					
; CollisionOFF: Enables user to disable
; collision detection for testing. (Default=0).
;================================================					
collisionoff=0

;================================================
; Difficulty setting: (0=EASY, 1=HARD)
;================================================
Difficulty=1

;================================================
; Enable bilineair filtering (0=OFF / 2=ON)
;================================================
FILTER=2

;================================================
; Number of laps to drive in city tracks.
; Range: 1-999 (default=2)
;================================================
Nrlaps=2

;================================================
; Selects steeringmodel:
; Old (Autobahn Raser I)=1
; New (A2 Racer II)=0
;================================================
stuur_model=0

;================================================
; Enables/disables fog (conflicts with alpha
; blending, therefore default=0)
;================================================					
fog=0

;================================================					
; Selects AI model:
; Old (Autobahn Raser I)=1
; New (A2 Racer II)=0
;================================================
ai_model=0

;================================================
; Selects traffic AI model:
; Old (A2 Racer II)=0
; New (M25)=1
;===============================================
traffic_ai_model=1

;================================================
; Diffculty tweak var.
; 0 - 3 easier, 4=normal, 5-9 harder
; Should be set to 4.
;================================================
dif_mod=4			

;================================================
; Enables/disables demo mode.
;================================================
demo=0

;================================================
; Enables/disables Wait for Vertical Blank.
;================================================
WAITVBL=1

;================================================
; Sets a chunks to start the track with.
; Should only be used for testing, otherwise
; it should be disabled.
;================================================
;startchunk=200

;================================================
; Enables/disables Cops.
;================================================
Police=1

;================================================
; Enables/disables all Traffic.
;================================================
Traffic=1

;================================================
; Enables/disables all opponents.
;================================================
Opponents=1

;================================================
; Enables/disables checkpoint bonus system.
;================================================
BonusCountDown=0

;================================================
; Enables/disables damage
;================================================
Invulnerable=0

;********************GFX OPTIONS*****************
[GFX OPTIONS]

;================================================
; Enables/disables alpha blended clouds.
;================================================
clouds=1

;================================================
; If disabled, no finish flag is shown when
; finished.
;================================================
finish_flag=1

;================================================
; Enables/disables alpha blended skidmarks.
;================================================
skidmarks=1

;================================================
; If enables, the skidmarks will fade away,
; if disabled, the skidmarks will disappear
; when the timer expires.
;================================================
fade_skmarks=1

;================================================
; Enables/Disables radar
;================================================
radar=1

;================================================
; Enables/Disables entire particle module.
; Currently the module isn't used, therefore
; default=0.
;================================================
particles=1

;================================================
; Enables/Disables Rain particle module.
;================================================
part_rain=1

;================================================
; Enables/disables entire 2D-overlay. When
; disabled, the user can't enable it by
; pressing the 'detail' key.
;================================================
disable_overlay=0

;================================================
; Overlay detail level. This can be adjusted by
; the player when pressing the 'detail' key.
; Default=3 (full detail: radar, all overlay
; graphics.	(min=0, max=3).
;================================================
overlay_detail=3

;================================================
; Enables/disables alpha blended object lights.
; This module is currently only used for brakes.
;================================================

object_lights=1

;================================================
; Gamma correction: 0=light, 1 = dark.
;================================================
gamma=0

;================================================
; Enables/disables all alpha blended modules.
; -Disables alpha blending on car shadows.
; -Disables clouds
; -Disables lights
;================================================
alpha_blending=1

;********************ETAPPE**********************
[ETAPPE]

;================================================
; Zero based track to be played (saved by menu).
;================================================
etappe=1

;================================================
; British track (cars on left side of road)
;================================================
british=0

;********************LEAGUE**********************
[LEAGUE]

;================================================
; Zero based league to be played (saved by menu).
;================================================
league=1


;********************PLAYER**********************
[PLAYER]

;================================================
; Saved by game to tell the menu wether the
; player was finished.
;================================================
finished=0

;================================================
; Current car the player has (saved by menu).
;================================================

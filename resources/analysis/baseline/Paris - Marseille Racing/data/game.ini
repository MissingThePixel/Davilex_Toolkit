;================================================
; ??
;================================================
copland=0

;================================================
; Amount of damage (min=0, max=100) the player
; has (saved by game).
;================================================
damage=0

;================================================
; Amount of money the player has (saved by both
; the menu and the game). OBSOLETE!
;================================================

;================================================
; Checkpoint:
; 	- Money: amount of money the player won with checkpoints
;	- Value: Checkpoint money per checkpoint
;	- speed: Speed at which the checkpoint counts down
;================================================
checkpoint_money=0
checkpoint_value=2000
checkpoint_speed=50

;================================================
; Finish time of player in msecs saved by the
; game.
;================================================
tracktime=156280

;================================================
; Number of laps the player has completed
;================================================

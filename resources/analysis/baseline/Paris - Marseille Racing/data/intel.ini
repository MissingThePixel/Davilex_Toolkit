;*****************GENERAL**********************
[GENERAL]

;==============================================
; Speed at which chased racer/player is stopped
; and arrested
;==============================================
StopSpeed=7

;==============================================
; Maximum cop chase time in easy mode
;==============================================
ChaseTimeEasy=30

;==============================================
; Maximum cop chase time in hard mode
;==============================================
ChaseTimeHard=60

;==============================================
; If the cop is this many chunks behind, he will
; stop the chase
;==============================================
GiveUpDist=50

;==============================================
; Maximum number of cops chasing the player in
; easy mode
;==============================================
CopsPerPlayerEasy=1

;==============================================
; Maximum number of cops chasing the player in
; hard mode
;==============================================
CopsPerPlayerHard=1

;==============================================
; Maximum number of cops per AI racer
;==============================================
CopsPerRacer=1

;==============================================
; Slow down factor when forced position down
;==============================================
SlowDownFactor=25

;==============================================
; Speed up factor when forced position up
;==============================================
SpeedUpFactor=30

;==============================================
; Speed penalty for racers in easy catch up close
;==============================================
CatchUpCloseEasy=25

;==============================================
; Speed penalty for racers in normal catch up close
;==============================================
CatchUpCloseNormal=15

;==============================================
; Speed penalty for racers in easy catch up far
;==============================================
CatchUpFarEasy=45

;==============================================
; Speed penalty for racers in normal catch up far
;==============================================
CatchUpFarNormal=35

;==============================================
; Chunk distance to activate catch up close easy
;==============================================
CatchUpCloseChunkEasy=12

;==============================================
; Chunk distance to activate catch up close normal
;==============================================
CatchUpCloseChunkNormal=17

;==============================================
; Chunk distance to activate catch up far
;==============================================
CatchUpFarChunk=30

;==============================================
; Minimum player speed to activate catch up
;==============================================
CatchUpSpeed=5

;==============================================
; Number of opponents in the game (max 6)
;==============================================
NrOpponents=6

;****************VIOLATIONS********************
[VIOLATIONS]

;==============================================
; Maximum speed on a 60 Km/h trigger
;==============================================
MaxSpeed60=50

;==============================================
; Maximum speed on a 80 km/h trigger
;==============================================
MaxSpeed80=70

;==============================================
; Maximum speed on a 120 km/h trigger
;==============================================
MaxSpeed120=100

;==============================================
; Maximum speed on a no max speed trigger
;==============================================
NoMaxSpeed=50

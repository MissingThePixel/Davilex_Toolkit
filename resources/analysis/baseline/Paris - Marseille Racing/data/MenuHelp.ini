[TfrmTournamentMenu]
CHAMPIONNAT DE FRANCE
Le Championnat de France comprend trois groupes. Ton but est de terminer en tête de chaque groupe et, finalement, de terminer premier du groupe final et de décrocher le titre de Champion de France.
 
GROUPE A
Egalement connu sous le nom de 'Groupe des voitures de série'. C'est l'occasion où jamais de te faire un nom. Mesure-toi pendant 6 manches avec des pilotes talentueux et accède au groupe supérieur.
GROUPE B
Egalement connu sous le nom de 'Groupe des voitures de sport de luxe'.
Tu cours 7 manches contre 6 pilotes chevronnés pour obtenir une place dans le dernier groupe. Tu ne peux accéder à ce groupe que quand tu as terminé en tête du Groupe A. 
GROUPE C
Egalement connu sous le nom de 'Groupe des voitures de course GT'.
Dans ce dernier groupe, il va vraiment falloir que tu te surpasses pour tenir à distance les 6 meilleurs coureurs de la Ligue pendant 8 étapes extrêmement difficiles. Voitures extraordinaires et vitesses terrifiantes. Si tu termines premier de ce groupe, tu auras vraiment mérité le titre de champion et tu pourras empocher le dernier bonus. Tu ne peux accéder à ce groupe que quand tu as terminé en tête du Groupe B. 

RESULTATS DE GROUPE
1 - Résultats de la course et positions dans le groupe pour ta voiture et celle de tes adversaires.
2 - Temps au tour et gains réalisés. 


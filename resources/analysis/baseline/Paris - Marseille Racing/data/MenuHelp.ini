[TfrmGarage]
GARAGE
Tu dois te rendre au garage pour réparer ou améliorer une voiture. Tu peux choisir n'importe quelle voiture de ton stand, à condition toutefois que cette voiture appartienne au groupe actif.

Réparer les dégâts
Les dégâts subis pendant une course peuvent être réparés au garage.

Améliorer
Choisis une des améliorations suivantes: roues, freins, accélération, moteur, turbo. Attention! Avant de pouvoir acheter le turbo, tu dois d'abord acheter un nouveau moteur.

SELECTIONNER UNE VOITURE
Ces boutons te permettent de sélectionner ou de regarder les voitures de ton stand. Cependant, seules les voitures disponibles pour le groupe actif pourront prendre le départ. 

Vente d'une voiture
Tu peux vendre ta voiture au prix de l'argus. Vérifie si tu as assez d'argent pour pouvoir acheter une nouvelle voiture du même groupe.

CONCESSIONNAIRE
Va chez le concessionnaire pour acheter une nouvelle voiture.

[TfrmHallOfFame]
PANTHEON
Tu vas automatiquement au Panthéon quand tu bats le record du tour ou que tu réalises le meilleur temps d'une course. Ces temps sont immortalisés au Panthéon. Naturellement, ce classement est exclusivement réservé aux meilleurs.


[TfrmOptionsMenuSide]
MENU A OPTIONS
Cet écran te donne un aperçu de tes configurations. Il te permet d'accéder aux menus Commande, Configuration et Joueur.

COMMANDE
C'est ici que tu détermines le mode de commande. Tu peux choisir entre les options suivantes: clavier, manette, chemin d'accès et volant.
Configuration des touches: tu es libre de configurer les touches comme tu veux.
Sensibilité: avec ce bouton, tu peux régler la sensibilité de la direction. La sensibilité diminue vers la gauche et augmente vers la droite.

CONFIGURATION
Volume: ce bouton te permet de modifier le volume du son de la police, de la musique et des effets sonores.
Mode vidéo: selon le matériel dont tu disposes, tu peux choisir entre trois modes vidéo: 320x200, 640x480 ou carte 3D.
Page d'accueil-infos: cet écran contient des informations sur la configuration des touches. Tu peux également désactiver la page d'accueil-infos. 

JOUEUR
Nouveau joueur: ce bouton permet à un autre joueur de commencer à jouer.
Enregistrer: enregistre les données de jeu actives.
Ouvrir: permet de charger un jeu enregistré. Sélectionne un jeu dans la liste proposée et clique ensuite sur le bouton 'ouvrir'.
Changer le nom: ce bouton te permet de changer ton nom de joueur actif.




[TfrmRaceMenu]
MENU COURSE
C'est le premier écran que tu aperçois lorsque tu lances le jeu.
Tu peux choisir ici de participer à un Contre-la-montre, à une Course ou au Championnat de France.

CONTRE-LA-MONTRE
Essaye d'améliorer les temps réalisés lors des qualifications et empoche le bonus du Contre-la-montre. Tu cours ces manches sans adversaire, sans la police et sans circulation. Le Contre-la-montre représente donc la solution idéale pour s'entraîner ou pour battre des records.

COURSE
Ce bouton permet de lancer une Course. Tu es libre de choisir la manche et la voiture avec laquelle tu veux courir. Finis premier à chaque manche et empoche le bonus de la Course.

CHAMPIONNAT DE FRANCE	
Ce bouton permet de lancer le Championnat de France. Ce championnat comprend trois groupes. Tu dois essayer de finir en tête de chaque groupe, et, finalement, de terminer premier du groupe final et de décrocher le titre de Champion de France.

QUITTER
Clique sur le bouton Quitter dans le Menu Course pour arrêter le jeu actif et retourner sous Windows.

[HelpOnStory]
Paris-Marseille Racing, L'HISTOIRE
Cela fait des années que la Ligue Paris-Marseille organise des courses illégales sur les autoroutes françaises. Ces courses ont été pour toi l'occasion de montrer que tu fais partie des meilleurs. Tu as beaucoup de talent! Et cela n'est pas passé inaperçu. Des courses illégales vont bientôt avoir lieu sur et autour de quelques-unes des plus dangereuses autoroutes de France. On te défie d'y participer! Ton but sera de te qualifier dans chacun des trois groupes. C'est le moment de montrer que tu as quelque chose dans le ventre, car seule la première place compte. As-tu le cran de relever le défi? 
 

[TfrmQuickRaceMenu]
COURSE
Ce bouton permet de lancer la Course. Tu es libre de choisir la manche et la voiture avec laquelle tu veux courir.

Sélectionne une voiture
Choisis d'abord le groupe dans lequel tu veux courir:
Groupe A: c'est le groupe des voitures de série: faciles à conduire mais lentes. Niveau: débutant.
Groupe B: c'est le groupe des voitures de sport de luxe: plutôt rapides. Niveau: amateur.
Groupe C: c'est le groupe des voitures de course GT: mégaspeed. Niveau: professionnel.
Sélectionne ensuite la voiture avec laquelle tu veux courir.

CHOISIS LE NOMBRE DE TOURS
A l'exception des manches qui ont lieu sur l'autoroute où tu ne peux courir qu'un seul tour, tu es libre de choisir le nombre de tours à courir par manche. Le nombre maximum de tours est 5.

RESULTATS DE LA COURSE
Tu peux consulter ici les résultats par manche de ta voiture et de celle de tes adversaires. A partir d'ici, tu peux rejoindre le Panthéon où sont immortalisés les meilleurs résultats de tous les temps.  

LE BONUS
Finis premier à chaque manche d'une Course et empoche le bonus. 


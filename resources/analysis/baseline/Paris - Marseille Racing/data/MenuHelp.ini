Groupe B: c'est le groupe des voitures de sport de luxe: plutôt rapides. Niveau: amateur.
Groupe C: c'est le groupe des voitures de course GT: mégaspeed. Niveau: professionnel.
Sélectionne ensuite la voiture avec laquelle tu veux courir.

Le bonus
Essaye d'améliorer les temps réalisés lors des qualifications et empoche le bonus du Contre-la-montre.

RESULTATS DU CONTRE-LA-MONTRE
Affiche tes cinq tours les plus rapides.

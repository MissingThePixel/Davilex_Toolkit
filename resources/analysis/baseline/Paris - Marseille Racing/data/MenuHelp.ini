CONTRE-LA-MONTRE
Dans le Contre-la-montre, tu es libre de choisir la manche et la voiture avec laquelle tu veux courir. Essaye d'améliorer les temps réalisés lors des qualifications et empoche le bonus du Contre-la-montre. Tu cours ces manches sans adversaire, sans la police et sans circulation. Le contre-la-montre représente donc la solution idéale pour s'entraîner et pour battre des records. 
Clique sur 'Echap' pour quitter la course.
 
Sélectionne une voiture

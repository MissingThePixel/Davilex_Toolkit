[TfrmGarage]
GARAGE
This is the place to be if you want to repair your car or buy an upgrade.
You can also select one of the other cars you already own, you can only race it as long as it belongs to the current league.

REPAIR DAMAGE
Any damage taken during a race can be repaired in the garage.

TUNE UP
Select one of the upgrades: wheels, breaking assist, gear, engine, turbo.
note you will need to buy a new engine before you can purchase the turbo.

SELECT CAR
With these buttons you can select or view one of the other cars you currently own, you can only race with it as long as it belongs to the current league.

SELL CAR
You can sell your car for its current value, make sure you have enough money to buy a new car from the same league.

SHOWROOM
You can purchase a new car in the showroom.

[TfrmHallOfFame]
HALL OF FAME
You will automatically enter the hall of fame when you break a lap time or total time record, these will be recorded in the hall of fame.

Remember, only the best of the best have their name listed in the hall of fame.

[TfrmOptionsMenuSide]
OPTIONS
This screen offers an overview of all of your settings; 
from here you can get to the controls, settings and player menu.

CONTROLS
Here you can set your controller, choose from: keyboard, joystick, gamepad, steering wheel
Key configuration: set the keys you prefere
Steer sensitivity: with this button you set the sensitivity,
left is less sensitive
right is more sensitive

SETTINGS
Volume: Here you can alter police, music and effects volume
Video mode: There are three video modes to choose from, depending on your hardware.
320x200, 640x480 or 3d card
Start info screen: the start info screen contains information on the current key configuration, you can disable the 'show screen before start' option as well.

PLAYER
New player: This enables another player to start a new game.
Save: Saves your current game data, in addition to the game's auto save.
Load: Load a saved game by selecting the game from the list and pressing the load button.
Delete: Deletes a player or saved game from the list.
Change name: here you can change your current player name.

[TfrmRaceMenu]
RACE MENU
This is the first screen you enter when you start the game.
From this screen you can choose to either enter the Time trial, Sunday cup or Tournament mode.

TIME TRIAL
Try to beat the qualification time limits to unlock the time trial bonus car.
You drive down a track without opponents, police or any other traffic, which makes it ideal for practice and breaking lap records.

SUNDAY CUP
This starts the Sunday Cup, you are free to choose the track and car you want to race in.
Finish first on all Sunday cup tracks and you'll unlock the bonus car.

TOURNAMENT
This starts the tournament mode, which is divided into three leagues.
Your goal is to finish first in all the leagues, and earn the title of London Racer.

QUIT
To end the game and exit to windows, press the quit button in the race menu.

[HelpOnStory]
LONDON RACER, THE STORY
The London Racer organisation has been holding illegal races throughout the UK year after year. 
Just like the very first London Race ever held, start and finish of these races are traditionally somewhere on the M25. 
The other tracks are kept secret until moments before the race. You must prove yourself in all three leagues. 
Winning the tracks will earn you better cars with which you may compete. 
Have you got what it takes to become the winner of this years London Race?  

[TfrmQuickRaceMenu]
SUNDAY CUP
This starts the Sunday Cup, in which you are free to choose the track and car you want to race in.

SELECTING A CAR
First select a league.
League 1: small cars, easy handling, slow speed, level: novice
League 2: luxury sports cars, medium speed, level: amateur
League 3: gt race cars, high speed, level: pro
then select the car you wish to drive.

SELECTING AMOUNT OF LAPS
You can select 1 upto 5 laps. Except for the motorway tracks, here you only drive 1 lap.

SUNDAY CUP RESULTS
Here you can view your personal race results and those of your opponents.
From here you can get to the hall of fame, which keeps track of the best times ever.

UNLOCKING THE BONUS CAR
Finish first on all the Sunday cup tracks and you unlock the bonus car

[TfrmTimeTrialMenu]
TIME TRIAL
the time trial, where you choose the track and car you want and race without traffic, police or opponents.
Here you can try to break the qualification times to unlock the time trial bonus car, set the fastest lap times or practice without any traffic.
press 'esc' to exit the race.

SELECTING A CAR
First select a league.
League 1: small cars, easy handling, slow speed, level: novice
League 2: luxury sports cars, medium speed, level: amateur
League 3: gt race cars, high speed, level: pro
then select the car you wish to drive.

UNLOCKING THE BONUS CAR
Try to beat the qualification time limits to unlock the time-trial bonus car.

TIME TRIAL RESULTS
Here you can view your five best lap results
From here you can get to the hall of fame, which keeps track of the best times ever.

[TfrmTournamentMenu]
TOURNAMENT
The tournament is divided into three leagues.
Your goal is to finish first in all the leagues, and earn the title of London Racer.

LEAGUE 1
League l is also known as the 'small car league'
This is your chance to make a name for yourself.
Compete on 6 tracks with some very talented drivers.

LEAGUE 2
League 2 is also known as the 'luxury sports car league'.
Challenge 6 extremely skilled opponents on 7 tracks for a place in the next league.
This league is inaccessible until you've won the 1st league.

LEAGUE 3
League 3 is also known as the 'GT race league'.
It's the ultimate challenge against the elite of the organisation,
where sensational cars battle it out at breakneck speeds.
This league is inaccessible until you've won the 2nd. League.
win this league and you'll win the ultimate bonus car and call yourself the London Racer!

LEAGUE RESULTS
1 - These are your and your opponents racing results and the league positions.
2 - These are your lap times and income.



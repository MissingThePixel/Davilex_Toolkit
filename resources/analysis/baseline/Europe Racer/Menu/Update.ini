[Text_NL]
LT_APPTITLE=Davilex Updater
LT_GETTING_INFO=Bezig met het ophalen van update-informatie
lT_CANCEL=Annuleren
LT_ERROR_DOWNLOADING_INFO=Er is een fout opgetreden tijdens het downloaden van de update-informatie.\nOm de updates te kunnen downloaden moet je verbonden zijn met Internet.\n\nMaak verbinding met Internet en probeer het opnieuw.
LT_RETRY=Opnieuw
LT_ERROR_IN_UPDATE=De update-informatie is niet juist. Neem contact op met Davilex Service.
LT_PD_UPDATES_FOUND=Er zijn %d updates gevonden.\nWil je deze updates nu downloaden?
LT_YES=Ja
LT_NO=Nee
LT_NO_UPDATES_FOUND=Er zijn geen updates gevonden.\nKies voor Voltooien om af te sluiten.
LT_NO_NEW_UPDATES_FOUND=Er zijn geen nieuwe updates gevonden.\nKies voor Voltooien om af te sluiten.
LT_FINISH=Voltooien
LT_DOWNLOADING_PD_OF_PD=Bezig met downloaden.\nBestand %d van %d.
LT_ERROR_DOWNLOADING_UPDATE=Er is een fout opgetreden tijdens het downloaden van het bestand.\nJe kunt het nog een keer proberen door Opnieuw te kiezen of je kunt afsluiten door Annuleren te kiezen.
LT_ASK_INSTALL_UPDATES=Wilt je de updates nu installeren?
LT_INSTALLING=Bezig met het installeren van de updates.
LT_OK=OK
LT_INSTALL_OK=De updates zijn succesvol geïnstalleerd.\nKies voor Voltooien om af te sluiten.
LT_INSTALL_NOT_OK=Er is een fout opgetreden tijdens de installatie van de update. Je kunt het opnieuw proberen door te kiezen voor Opnieuw.\nJe kunt afsluiten door Annuleren te kiezen.

[Text_UK]
LT_APPTITLE=Davilex Updater
LT_GETTING_INFO=Getting update information.
lT_CANCEL=Cancel
LT_ERROR_DOWNLOADING_INFO=An error has occurred while downloading update information. To download updates you need an Internet connection. Set up a connection with the Internet and try again.
LT_RETRY=Again
LT_ERROR_IN_UPDATE=Update information is incorrect. Contact Davilex Service.
LT_PD_UPDATES_FOUND=%d Updates have been found. Do you want do download these updates now?
LT_YES=Yes
LT_NO=No
LT_NO_UPDATES_FOUND=No updates have been found. Choose Finish to end.
LT_NO_NEW_UPDATES_FOUND=No updates have been found. Choose Finish to end.
LT_FINISH=Finish
LT_DOWNLOADING_PD_OF_PD=Downloading. File %d of %d.
LT_ERROR_DOWNLOADING_UPDATE=An error has occurred while downloading the file. You can try again by choosing Again or you can terminate by choosing Cancel.
LT_ASK_INSTALL_UPDATES=Do you want to install updates now?
LT_INSTALLING=Installing updates.
LT_OK=OK
LT_INSTALL_OK=Updates have been successfully installed. Select Finish to end.
LT_INSTALL_NOT_OK=An error has occurred during the installation of the update. You can try again by choosing Again. You can terminate by choosing Cancel.

[Text_DE]
LT_APPTITLE=Davilex Updater
LT_GETTING_INFO=Update-Informationen laden.
lT_CANCEL=Abbrechen
LT_ERROR_DOWNLOADING_INFO=Beim Übertragen der Update-Informationen ist ein Fehler aufgetreten. Sie müssen mit dem Internet verbunden sein, um Updates herunterladen zu können. Stellen Sie eine Verbindung mit dem Internet her und versuchen Sie es erneut.
LT_RETRY=Erneut
LT_ERROR_IN_UPDATE=Die Update-Informationen sind nicht korrekt. Setzen Sie sich mit dem Kundendienst von Davilex in Verbindung.
LT_PD_UPDATES_FOUND=Es wurden %d Updates gefunden. Möchten Sie diese Updates jetzt herunterladen?
LT_YES=Ja
LT_NO=Nein
LT_NO_UPDATES_FOUND=Es wurden keine Updates gefunden. Wählen Sie Beenden.
LT_NO_NEW_UPDATES_FOUND=Es wurden keine Updates gefunden. Wählen Sie Beenden.
LT_FINISH=Beenden
LT_DOWNLOADING_PD_OF_PD=Daten werden heruntergeladen. Datei %d von %d.
LT_ERROR_DOWNLOADING_UPDATE=Beim Übertragen der Datei ist ein Fehler aufgetreten. Klicken Sie auf Erneut, um es erneut zu versuchen oder auf Abbrechen, um den Vorgang zu beenden.
LT_ASK_INSTALL_UPDATES=Möchten Sie die Updates jetzt installieren?
LT_INSTALLING=Updates werden installiert.
LT_OK=OK
LT_INSTALL_OK=Die Updates wurden erfolgreich installiert. Wählen Sie Beenden.
LT_INSTALL_NOT_OK=Bei der Installation des Updates ist ein Fehler aufgetreten. Drücken Sie auf Erneut, um die Installation erneut durchzuführen. Wenn Sie die Installation abbrechen möchten, klicken Sie auf Abbrechen.

[Text_FR]
LT_APPTITLE=Davilex Updater
LT_GETTING_INFO=Obtenir des informations de mise à jour.
lT_CANCEL=Annuler
LT_ERROR_DOWNLOADING_INFO=Une erreur s'est produite lors du téléchargement des informations de mise à jour. Une connexion Internet est nécessaire pour télécharger les mises à jour. Installez une connexion Internet et réessayez.
LT_RETRY=Réessayer
LT_ERROR_IN_UPDATE=Les informations de mise à jour sont incorrectes. Contactez le service Davilex.
LT_PD_UPDATES_FOUND=%d mises à jour ont été trouvées. Voulez-vous télécharger ces mises à jour maintenant ?
LT_YES=Oui
LT_NO=Non
LT_NO_UPDATES_FOUND=Aucune mise à jour n'a été trouvée. Cliquez sur Terminer pour quitter le programme.
LT_NO_NEW_UPDATES_FOUND=Aucune mise à jour n'a été trouvée. Cliquez sur Terminer pour quitter le programme.
LT_FINISH=Terminer
LT_DOWNLOADING_PD_OF_PD=Téléchargement en cours. Fichier %d sur %d.
LT_ERROR_DOWNLOADING_UPDATE=Une erreur s'est produite lors du téléchargement du fichier. Essayez à nouveau en cliquant sur Réessayer ou quittez  en cliquant sur Annuler.
LT_ASK_INSTALL_UPDATES=Voulez-vous installer les mises à jour maintenant ?
LT_INSTALLING=Installation des mises à jour.
LT_OK=OK
LT_INSTALL_OK=Installation des mises à jour réussie. Sélectionnez Terminer pour revenir au programme.
LT_INSTALL_NOT_OK=Une erreur s'est produite lors de l'installation de la mise à jour. Vous pouvez essayer à nouveau en cliquant sur Réessayer. Vous pouvez quitter le programme en cliquant sur Annuler.


[Text_ES]
LT_APPTITLE=Davilex Updater
LT_GETTING_INFO=Obteniendo información de mejoras.
lT_CANCEL=Cancelar
LT_ERROR_DOWNLOADING_INFO=Se ha producido un error al descargar información sobre mejoras. Para descargar mejoras, necesitas una conexión a Internet. Instala una conexión a Internet y vuelve e intentarlo.
LT_RETRY=Otra vez
LT_ERROR_IN_UPDATE=La información de mejoras es incorrecta. Ponte en contacto con el Servicio de Davilex.
LT_PD_UPDATES_FOUND=Se han encontrado %d mejoras. ¿Quieres descargarlas ahora?
LT_YES=Sí
LT_NO=No
LT_NO_UPDATES_FOUND=No se ha encontrado ninguna mejora. Elige Terminar para acabar.
LT_NO_NEW_UPDATES_FOUND=No se ha encontrado ninguna mejora. Elige Terminar para acabar.
LT_FINISH=Terminar
LT_DOWNLOADING_PD_OF_PD=Descargando. Archivo %d de %d.
LT_ERROR_DOWNLOADING_UPDATE=Se ha producido un error al descargar el archivo. Si quieres volver a intentarlo, elige Otra vez. Si quieres acabar, elige Cancelar.
LT_ASK_INSTALL_UPDATES=¿Quieres instalar las mejoras ahora?
LT_INSTALLING=Instalando mejoras.
LT_OK=Aceptar
LT_INSTALL_OK=Las mejoras se han instalado correctamente. Selecciona Terminar para acabar.
LT_INSTALL_NOT_OK=Se ha producido un error durante la instalación de la mejora. Si quieres volver a intentarlo, elige Otra vez. Si quieres terminar, elige Cancelar.


[Text_IT]
LT_APPTITLE=Davilex Updater
LT_GETTING_INFO=Ricerca informazioni aggiornate.
lT_CANCEL=Annulla
LT_ERROR_DOWNLOADING_INFO=Si è verificato un errore mentre si scaricavano le informazioni aggiornate. Per scaricare gli aggiornamenti è necessaria una connessione Internet. Stabilisci una connessione Internet e riprova.
LT_RETRY=Riprova
LT_ERROR_IN_UPDATE=Le informazioni aggiornate non sono corrette. Contatta Davilex Service.
LT_PD_UPDATES_FOUND=Sono stati trovati %d aggiornamenti. Vuoi scaricarli ora?
LT_YES=Sì
LT_NO=No
LT_NO_UPDATES_FOUND=Non ci sono aggiornamenti. Seleziona Fine per terminare.
LT_NO_NEW_UPDATES_FOUND=Non ci sono aggiornamenti. Seleziona Fine per terminare.
LT_FINISH=Fine
LT_DOWNLOADING_PD_OF_PD=Scaricamento File %d di %d.
LT_ERROR_DOWNLOADING_UPDATE=Si è verificato un errore mentre si scaricava il file. Puoi riprovare selezionando Riprova o terminare selezionando Annulla.
LT_ASK_INSTALL_UPDATES=Vuoi installare gli aggiornamenti ora?
LT_INSTALLING=Installazione aggiornamenti.
LT_OK=OK
LT_INSTALL_OK=Gli aggiornamenti sono stati installati con successo. Seleziona Fine per terminare.
LT_INSTALL_NOT_OK=Si è verificato un errore durante l'installazione dell'aggiornamento. Puoi riprovare selezionando Riprova o terminare selezionando Annulla.


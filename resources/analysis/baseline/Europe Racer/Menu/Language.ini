; Track info large version
; --------------------------------------------------------------------------------
LT_INF_TRACK00=Rome\n\nVisit all the tourist attractions at an amazing speed! Race through the narrow streets in the centre of Rome and drive straight through the Coliseum. Oh, and don't forget Saint Peter's Square!
LT_INF_TRACK01=Amsterdam\n\nCan you hold your own in this lively city? Race right through the energetic centre! Test your driving skills in the small streets along the canals.
LT_INF_TRACK02=Oxford\n\nThis is your change to show your driving skills. In this world-famous university city you'll find sharp bends and narrow streets.
LT_INF_TRACK03=Berlin\n\nReady for the fastest city tour of your life? Then let's race along the Reichstag and under the Brandenburger Tor. These broad avenues really invite top speed driving.
LT_INF_TRACK04=Barcelona\n\nDo you have the right temperament for this Spanish city? You can test it on the broad avenues and in the busy harbour. But pay attention to the median strip!
LT_INF_TRACK05=Scenic route France\n\nThis beautiful route takes you through the hills of Lyon to Marseille. You won't have time to shoot any pictures though, because you'll need to stay alert in this rugged landscape!
LT_INF_TRACK06=Scenic route England\n\nHave you always wanted to race right through a historical monument? Take you chance on this route. The road to London leads over the hills and right through famous Stonehenge.
LT_INF_TRACK07=Vienna\n\nPeel some rubber in a classical town, racing over the Opera Ring or through the vast park. You'll also speed past the Prater, the famous Ferris Wheel.
LT_INF_TRACK08=Paris\n\nThe city of lights doesn't offer just romance but super-fast action too! Race along the Seine, the Notre Dame and the Arc de Triomphe! And, most exiting of all, you'll pass right under the Eiffel Tower!
LT_INF_TRACK09=Madrid\n\nA few surprises await you in this hot-blooded city! To name a few: unsuspected bends, sudden tunnel entries and several squares. Test your reactions!
LT_INF_TRACK10=Stockholm\n\nThis Swedish town is a well-kept racing secret. You can race marvellously over the town square, along the sloping cliffs and through the enormous park. But pay attention, it could start to rain.
LT_INF_TRACK11=London\n\nRacing through the world-famous centre of London. Speeding along the wide roads, along Piccadilly Circus and Big Ben. Who would have thought this possible? We did!
LT_INF_TRACK12=Marseille\n\nStart your engine and hold on tight! You'll be racing through narrow streets with waving clothes lines, over small steps and through short tunnels. You'll also pay a visit to the marina.
LT_INF_TRACK13=Hamburg\n\nA track to give you goose bumps! You'll drive through the lively harbour, over ships and along gigantic oil tanks. Look out for that patch of sandy road, it's slippery!
LT_INF_TRACK14=Autobahn Munich - Vienna\n\nThe dream of any racing driver! Set in beautiful mountain scenery, this motorway is the ideal racetrack. And maybe you'd like to have a look outside the usual track as well?
LT_INF_TRACK15=CANCELLED
LT_INF_TRACK16=Monaco - Nice\n\nThe ultimate track for gutsy racers! The coastal road along the Côte d'Azur offers a fantastic view as well as some challenging bends! Can you keep your wheels under control?
LT_INF_TRACK17=Athens\n\nWhat a combination: classical antiquity and our modern racing monsters! You'll race up the Acropolis and in between the ruins. Be prepared for a giant jump!
LT_INF_TRACK18=Florence\n\nNo time to act like a tourist! In this classical Italian city with its narrow streets and many squares lies an exiting racetrack. Watch out for those pavement café's!
LT_INF_TRACK19=Moscow\n\nBetter put on your fur cap, cause this cold city has a fantastic racetrack! Via the broad avenues you'll arrive on Red Square. You'll even drive straight through the Kremlin! Watch out for that snow though!
LT_INF_TRACK20=London Park\n\nIsn't it about time somebody stirred up this stylish city? You can do that when you tear past Buckingham Palace and Hyde Park.


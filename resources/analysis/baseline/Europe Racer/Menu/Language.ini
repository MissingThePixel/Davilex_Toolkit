; Information texts
; ------------------------------------------------------------------------------
LT_INF_GT_QUICKRACE=Quick Race\n\nIn a Quick Race you compete over one single track. You can choose from:\n- Single Track Race\n- Duel Race\n- Time Trial\n- Sudden Death Race
LT_INF_GT_CHAMPIONSHIP=Championships\n\nThere are separate Championships in which you race 5 tracks for specific types of cars.\nYou can choose between the:\n-Standard car\n-ATV\n-Sports car
LT_INF_GT_ADVENTURE=Adventure\n\nA big race for the very best drivers, offering something for everybody. The 20 tracks vary from highway to winding path, and from rough terrain to the docks.\nYou can also upgrade your car!
LT_INF_QR_TRACK=Single Track Race\n\nA perfect race for a quick practice. You race against four other racers. That way you can easily and quickly check out the competition and the tracks.
LT_INF_QR_DUEL=Duel\n\nYou think you're the best? Prove it by challenging an opponent for a duel race. You can select your competition from a list of the world's top drivers. Are you ready to accept this challenge?
LT_INF_QR_TIMETRIAL=Time Trial\n\nThis race against the clock is particularly suited to the perfectionist aiming to improve his personal record. Cause you can always go faster!
LT_INF_QR_SUDDENDEATH=Sudden Death:\n\nLooking for heartstopping sensation? Try this knock-out race. It's very simple: the weak will be eliminated and only the strongest will survive!
LT_INF_DF_EASY=Easy\n\nEspecially for beginners! You won't get much resistance from the police or the competition.
LT_INF_DF_NORMAL=Normal\n\nFor the more experienced racer. Your opponents will never let off!
LT_INF_DF_HARD=Hard\n\nFor top drivers and daredevils. Heavy opposition from the police and your opponents!
LT_INF_CC_CLASSIC=CANCELLED
LT_INF_CC_STANDARD=Standard Car Championship\n\nEven in a standard car you can go to the max! You'll explore your car's limits in:\n- Rome\n- Florence\n- Paris\n- Amsterdam\n- Marseille
LT_INF_CC_ATV=ATV Championship\n\nRacing in an ATV means you can drive over the roughest terrains. You can test it for yourself in:\n- Athens\n- Moscow\n- Hamburg Harbour\n- Stockholm\n- England
LT_INF_CC_SPORT=Sports Car Championship\n\nA sports car is not only super-fast but a great looker too. You can show off your car in:\n- London\n- Vienna\n- Berlin\n- Madrid\n- Barcelona
LT_INF_CC_EXTRA=This option is locked until you have downloaded a car.
LT_INF_ED_CHIEFPOLICE=J.B. Black\n\nThis police commissioner from Europol is a fanatical and formidable opponent.
LT_INF_ED_GHOSTCAR=CANCELLED
LT_INF_CB_USA=Club USA\n\nWe Americans are bigger and better than our opponents. Join us if you really want to win.
LT_INF_CB_RUSSIA=Club Moskow Masjina\n\nCome race for us; we Russians aren't afraid to damage our cars.
LT_INF_CB_GERMANY=Autobahn Raser Club\n\nWe've already won four times, so come race with us and secure a fifth victory for Germany.
LT_INF_CB_FRANCE=Le bolide Club de France\n\nWe French can win easily; we're friends of the organisers.
LT_INF_CB_ENGLAND=London Racer club\n\nIf you want to win with style, join the British racing team. We British are fast and furious and anything goes, as long as it's done with style.
LT_INF_CB_ITALY=Motori d'Italia\n\nOur beautiful cars are ultra-fast and will surely make you get hold of the victory for Italy.
LT_INF_CB_JAPAN=Riders of the Rising Sun\n\nOur Japanese cars are exquiped with the latest technique. Make our country proud and land the victory.
LT_INF_CB_HOLLAND=A2 Racer club\n\nCome race for Holland and show those Germans what you're made of. This year victory will be ours!



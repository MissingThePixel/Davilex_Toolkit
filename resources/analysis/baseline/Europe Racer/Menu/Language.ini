LT_INF_ED_GERMANY=He drives well and fast, this sturdy German. Excellent at handling bends, but not at keeping a respectful distance.
LT_INF_ED_FRANCE=This French wine maker isn't exactly a neat driver. He gives way to all other traffic, for fear of collisions.
LT_INF_ED_ENGLAND=A well-mannered English gentleman. He drives fast, maintains his car well and doesn't like collisions.
LT_INF_ED_ITALY=An excellent racer, this Italian journalist. He loves risks but he takes good care of his car.
LT_INF_ED_JAPAN=A Japanese woman with guts! She drives fast and accurate and often does her own repairs. She doesn't like to take risks and hates collisions.
LT_INF_ED_HOLLAND=A Dutch entrepreneur who loves money. A good racer who takes few risks nevertheless.

